<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>W-JEPA · Explore the representations</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head><body class="embed-page" data-figure-view="pca">
<div class="wjepa-figure" id="wjepa-figure">
  <section class="representation-section" id="explorer" aria-label="DSADS cycling representations">
    <div class="figure-toolbar">
      <div class="legend" aria-label="Activities">
        <span class="legend-item"><span class="shape circle" aria-hidden="true"></span>Horizontal cycling</span>
        <span class="legend-item"><span class="shape triangle" aria-hidden="true"></span>Vertical cycling</span>
      </div>
      <div class="figure-filters">
        <label for="split">Split <select id="split"><option value="participant">Unseen participants</option><option value="window" selected>Random windows</option></select></label>
        <label for="participant">Highlight <select id="participant"><option value="all">All participants</option></select></label>
      </div>
    </div>
    <figure class="pca-figure" aria-describedby="pca-caption">
      <div class="plots">
        <section class="plot-panel" aria-labelledby="baseline-title">
          <div class="plot-header"><div><span class="panel-letter">A</span><h3 id="baseline-title">JEPA</h3></div><span class="panel-tag">Reference</span></div>
          <p class="plot-subtitle">Raw temporal tokens <span id="baseline-variance">27.3% variance explained</span></p>
          <div class="scatter-wrap"><canvas id="scatter-reference" tabindex="0" role="img" aria-label="Fixed JEPA PCA reference. Use arrow keys to inspect the same recordings in both panels."></canvas></div>
        </section>
        <section class="plot-panel moving-panel" aria-labelledby="stage-title">
          <div class="plot-header"><div><span class="panel-letter">B</span><h3 id="stage-title">JEPA</h3></div><span class="panel-tag animated-tag" id="stage-tag">Interactive</span></div>
          <p class="plot-subtitle"><span id="stage-subtitle">Raw temporal tokens</span><span id="variance">27.3% variance explained</span></p>
          <div class="scatter-wrap"><canvas id="scatter" tabindex="0" role="img" aria-label="Animated PCA of 360 cycling recordings. Circles show horizontal cycling, triangles show vertical cycling. Use arrow keys to inspect recordings; Escape clears selection."></canvas><div id="tooltip" class="plot-tooltip" role="tooltip" hidden></div></div>
        </section>
      </div>
      <div class="playback">
        <button id="play" class="play-button" type="button" aria-pressed="false"><span id="play-symbol" aria-hidden="true">▶</span><span id="play-label">Play transition</span></button>
        <div class="scrubber">
          <div class="endpoints"><button id="before" type="button" class="endpoint active">JEPA</button><output id="progress-value" for="progress">0%</output><button id="after" type="button" class="endpoint">W-JEPA</button></div>
          <label class="sr-only" for="progress">Transition from JEPA to W-JEPA</label><input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-valuetext="JEPA, 0 percent">
        </div>
        <label class="trail-toggle"><input id="trails" type="checkbox"><span>Trails</span></label>
        <button id="reset" class="reset-button" type="button">Reset</button>
      </div>
      <figcaption class="figure-caption" id="pca-caption"><p>Horizontal and vertical cycling, viewed through two trained encoders. Follow the same recordings as the right-hand PCA moves from JEPA to W-JEPA.</p></figcaption>
    </figure>
    <div class="inspector" id="inspector" aria-live="polite" hidden><p id="inspector-text"></p><button type="button" id="clear-selection" hidden>Clear</button></div>
  </section>

  <div class="sr-only" id="announcer" aria-live="polite"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
